name: Build Agenda+ for Windows Notebook
on:
  push:
    branches: [feature/agenda-notebook-v0.3.0]
    paths:
      - '.github/workflows/build-notebook-windows.yml'
      - 'desktop/**'
      - 'app/**'
      - 'lib/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://wpgwopmfvthrxuzilxdw.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aWUFcoFlyilmSLWkg3yTIg_pidO2fxU
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Install Agenda+ dependencies
        run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Build Agenda+ web app
        run: npx expo export --platform web
      - name: Package Agenda+ as Windows portable app
        shell: pwsh
        run: |
          Copy-Item -Path dist -Destination desktop/dist -Recurse -Force
          Push-Location desktop
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win portable --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          if (!(Test-Path windows-release/AgendaPlus-v0.3.0-Notebook.exe)) { throw 'Windows app was not created' }
          Get-FileHash windows-release/AgendaPlus-v0.3.0-Notebook.exe -Algorithm SHA256
      - name: Upload Windows executable for tests
        uses: actions/upload-artifact@v4
        with:
          name: AgendaPlus-v0.3.0-Notebook-Windows
          path: windows-release/AgendaPlus-v0.3.0-Notebook.exe
          if-no-files-found: error
      - name: Publish direct notebook download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.0-windows --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.3.0-windows "windows-release/AgendaPlus-v0.3.0-Notebook.exe" --clobber --repo "${{ github.repository }}"
          } else {
            gh release create v0.3.0-windows "windows-release/AgendaPlus-v0.3.0-Notebook.exe" --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "Agenda+ v0.3.0 — Notebook Windows (teste)" --notes "Aplicativo portátil para Windows 10/11. Abra o arquivo .exe sem Expo Go, Android ou ferramentas de programação. Utiliza a mesma conta e o mesmo banco Supabase do Agenda+ para Android. Confirmação por e-mail e SMTP seguem com configuração pendente. Aplicativo de testes sem assinatura comercial."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
