name: CI

on:
  push:
    branches:
      - main
      - audit/supabase-integration
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo dependency check
        run: npx expo install --check

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit
